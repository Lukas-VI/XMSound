android.experimental.enableNewResourceShrinker.preciseShrinking=true
# android-37 is newer than AGP 9.1.0's recommended maximum (36); required by androidx.core 1.19.0.
android.suppressUnsupportedCompileSdk=37
android.enableAppCompileTimeRClass=true
android.useAndroidX=true

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
